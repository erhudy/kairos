---
apiVersion: v1
kind: Namespace
metadata:
  name: namespace-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erhudy-test-every-minute
  namespace: namespace-1
  annotations:
    kairos.erhudy.com/cron-pattern: "* * * * *"
spec:
  selector:
    matchLabels:
      app: erhudy-test-every-minute
  template:
    metadata:
      labels:
        app: erhudy-test-every-minute
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: erhudy-test
          image: alpine:latest
          command: ["sleep", "infinity"]
