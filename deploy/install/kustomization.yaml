apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base

# pinned to a release tag rather than :latest so an install is reproducible;
# bump this alongside each release
images:
- name: ghcr.io/erhudy/kairos
  newName: ghcr.io/erhudy/kairos
  newTag: v1.0.0

namespace: kube-system
